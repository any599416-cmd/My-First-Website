<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网站 </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 强制科技风后备样式，确保本地预览能看到深色背景 */
        :root{--primary:#00E5FF;--secondary:#7C4DFF;--bg-start:#071028;--bg-end:#0b1220}
        html,body{height:100%}
        /* 强制深色背景，使用 !important 以覆盖任何 CDN/浏览器样式冲突 */
        body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;color:#e6f7ff !important;background-attachment:fixed}

    /* 星空背景（多层） - 使用固定背景层 #site-bg 来确保在内容后方可见 */
    #site-bg, .star-nebula{position:fixed;inset:0;z-index:0;pointer-events:none}
    /* 基础渐变夜空；同时使用图片作为背景（图片文件放在项目根 e:\Html\intone\matrix-bg.jpg）
       如果你把图片放在子目录（例如 assets/），请更新 URL 路径为 ./assets/matrix-bg.jpg */
    /* 背景图片设置：优先使用相对路径（./matrix-bg.jpg），如果本地 file:// 预览对相对路径有问题，可以打开下面的 file:// 绝对路径注释并按需调整为你的磁盘路径 */
    #site-bg{background:
        /* 首先尝试 file:// 绝对路径（Windows 示例），许多本地浏览器在 file:// 环境下能直接读取绝对路径 */
        url('file:///e:/Html/intone/matrix-bg.jpg') center/cover no-repeat,
        /* 其次尝试相对路径（作为回退） */
        url('./matrix-bg.jpg') center/cover no-repeat,
        /* 叠加的渐变（作为调色/遮罩） */
        linear-gradient(180deg,var(--bg-start) 0%, #061025 40%, var(--bg-end) 100%);
        /* 轻微滤镜以提高可见性（file:// 预览通常颜色偏暗） */
        filter:contrast(1.08) brightness(1.02);
    }
    /* 如果你在 file:// 下仍看不到图片，试试把下面的注释复制到上面的 url() 中，替换为你的实际磁盘路径（示例）：
       url('file:///e:/Html/intone/matrix-bg.jpg') center/cover no-repeat
    */
    /* 明确的星点层：使用真实 DOM 节点替代 ::after，解决某些浏览器/本地预览对伪元素渲染不一致的问题 */
    /* 更明显的星点层：混合小/中/大颗粒，提升对比度以便本地预览可见 */
    #site-bg .stars-layer{position:absolute;inset:0;background-image:
        radial-gradient(2px 2px at 12% 18%, rgba(255,255,255,0.95) 50%, transparent 51%),
        radial-gradient(1.4px 1.4px at 28% 42%, rgba(255,255,255,0.9) 50%, transparent 51%),
        radial-gradient(1px 1px at 48% 26%, rgba(255,255,255,0.85) 50%, transparent 51%),
        radial-gradient(0.9px 0.9px at 72% 12%, rgba(255,255,255,0.75) 50%, transparent 51%),
        radial-gradient(2.6px 2.6px at 80% 78%, rgba(255,255,255,0.65) 50%, transparent 51%),
        radial-gradient(0.8px 0.8px at 44% 82%, rgba(255,255,255,0.7) 50%, transparent 51%);
        opacity:1;background-repeat:repeat;background-size:1200px 900px;mix-blend-mode:screen}

        /* 大范围星云（静态） */
    .star-nebula{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 20% 30%, rgba(0,229,255,0.06), transparent 10%), radial-gradient(circle at 80% 70%, rgba(124,77,255,0.05), transparent 12%);filter:blur(22px);opacity:0.88}

        /* 关闭所有星空动画，静态展示 */
        body::after, .star-nebula{animation:none}

        /* 在较低性能或打印时降级（减少模糊） */
        @media (prefers-reduced-motion: reduce){
            .star-nebula{filter:blur(10px);opacity:0.85}
        }
    /* 备选绝对覆盖（改为透明以让 #site-bg 可见） */
    html, body { background-color: transparent !important; }
    /* Canvas 矢量背景（矩阵风格） */
    #matrixCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:block}
    /* 轻微网格仅作纹理（降低不透明度以免覆盖星点） */
    .bg-grid{background-image:radial-gradient(rgba(255,255,255,0.008) 1px, transparent 1px),linear-gradient(90deg, rgba(255,255,255,0.008) 1px, transparent 1px);background-size:40px 40px,40px 40px}
    /* site-content 层放置在背景之上 */
    .site-content{position:relative;z-index:5}
    /* 明确星点层可视性与无交互性：确保不使用混合模式，显式 z-index，让本地预览稳定可见 */
    #site-bg .stars-layer{pointer-events:none;background-repeat:repeat;background-size:1200px 900px;z-index:0;mix-blend-mode:normal}

    /* （已清理）诊断覆盖层已移除；保留 .stars-layer 为永久星点层 */

    /* 调试条：显示背景层状态（仅用于排查，可删） */
    .bg-debug{position:fixed;right:12px;top:12px;z-index:9999;background:rgba(0,0,0,0.6);color:#dff;backdrop-filter:blur(6px);padding:8px 10px;border-radius:8px;font-size:12px;line-height:1.2;max-width:220px}
    .bg-debug b{display:block;color:#fff;margin-bottom:4px}

    /* 更强霓虹发光效果，文字更清晰 */
        .text-neon{color: #e6ffff; text-shadow:0 2px 6px rgba(0,229,255,0.12),0 0 18px rgba(0,229,255,0.42),0 0 36px rgba(124,77,255,0.18);}
    .logo-svg{filter:drop-shadow(0 10px 26px rgba(0,229,255,0.22))}
    /* 导航：玻璃 + 霓虹高亮效果 */
    nav{position:sticky;top:12px;z-index:60;padding:8px 0;display:block}
    nav .nav-inner{max-width:1100px;margin:0 auto;padding:6px 16px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow:0 8px 28px rgba(2,6,15,0.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.04);transition:transform .18s ease,box-shadow .18s ease}
    /* 霓虹边框线条（伪元素） */
    nav .nav-inner::before{content:'';position:absolute;left:50%;top:0;transform:translateX(-50%);width:calc(100% - 36px);height:100%;border-radius:12px;pointer-events:none;z-index:0;mix-blend-mode:screen}
    nav .nav-inner .title-container{position:relative;z-index:2}
    /* 鼠标悬停时微放大并加强 glow */
    nav .nav-inner:hover{transform:translateY(-2px);box-shadow:0 16px 48px rgba(2,6,15,0.72)}
    /* 小屏幕缩减内边距 */
    @media (max-width:640px){nav .nav-inner{padding:8px 10px}}
        .container{max-width:1100px;margin:0 auto;padding:0 1rem}
    .logo-title{font-weight:900;font-size:1.35rem;color:#ffffff}
    /* 标题框（酷炫边框） */
    /* 居中并保持激活的标题框 */
    .title-frame{display:inline-block;padding:4px 10px;border-radius:8px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));box-shadow:0 4px 18px rgba(12,30,42,0.55);border:1px solid rgba(255,255,255,0.04);position:relative;overflow:visible}
    /* 居中定位：将容器设置为相对定位的父内绝对居中 */
    nav .title-container{position:relative;width:100%;display:flex;justify-content:center;align-items:center}
    .title-frame::before{content:'';position:absolute;inset:-2px;border-radius:12px;background:linear-gradient(90deg,var(--primary),var(--secondary));filter:blur(10px);opacity:1;z-index:-1;transition:all .28s ease}
    .title-text{color:#e6f7ff;font-weight:800;letter-spacing:0.4px;font-size:1.05rem;text-shadow:0 1px 6px rgba(0,229,255,0.06)}
    /* 保持 hover 状态的更强光晕 */
    .title-frame.always-glow::before{filter:blur(14px);transform:scale(1.03);opacity:1}
        /* 增大顶部间距，让英雄区下移，避免紧贴导航 */
        header.hero{padding:6.5rem 0 7rem 0}
    /* 英雄区标题调整为更合适的尺寸 */
    .hero h1{font-size:clamp(2rem,6vw,4rem);line-height:1.02;margin-bottom:0.25rem}
        .hero .lead{margin-top:1rem;color:rgba(230,247,255,0.85);max-width:60ch}

        /* 右侧卡通科技图样式 */
        .hero-row{display:flex;align-items:center;justify-content:space-between;gap:24px}
        .hero-art{flex:0 0 360px;max-width:40%;display:flex;align-items:center;justify-content:center}
        .hero-art svg{width:100%;height:auto;transform:translateZ(0);transition:transform .12s ease-out}
        /* 悬浮动画 */
        .floaty{animation:float 6s ease-in-out infinite}
        @keyframes float{0%{transform:translateY(0)}50%{transform:translateY(-10px)}100%{transform:translateY(0)}}
        /* 视差层次 */
        .parallax{will-change:transform}
        /* 移动端隐藏 */
        @media (max-width: 768px){
            .hero-row{flex-direction:column}
            .hero-art{display:none}
        }
    </style>
</head>
<body class="bg-grid">
    <!-- 固定背景层（保证在内容后方可见） -->
    <div id="site-bg" aria-hidden="true"><div class="stars-layer" aria-hidden="true"></div></div>
    <!-- Canvas 备份背景：在 file:// 环境下更可靠，绘制矩阵风格效果 -->
    <canvas id="matrixCanvas" aria-hidden="true"></canvas>
    <!-- 背景加载状态提示（临时诊断） 已移除 -->
    <!-- debug overlay removed -->
    <!-- 星空星云层 -->
    <div class="star-nebula" aria-hidden="true"></div>
    <div class="site-content">
    <nav>
        <div class="nav-inner container" style="position:relative;display:flex;align-items:center;justify-content:space-between;height:64px">
            <div class="title-container">
                <div class="title-frame always-glow" role="banner">
                    <span class="title-text">我的第一个网站</span>
                </div>
            </div>
            <!-- 已移除顶部链接，保留空白占位以维持布局 -->
            <div class="hidden md:flex" style="gap:32px;color:rgba(255,255,255,0.75)"></div>
            <div class="md:hidden">
                <button id="menuBtn" aria-label="打开菜单" style="background:none;border:none;color:rgba(255,255,255,0.8)">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 6h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 12h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M3 18h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                </button>
            </div>
        </div>
        <!-- 移动菜单内容已清空（保留容器以便将来扩展） -->
    <div id="mobileMenu" class="hidden" style="background:transparent"></div>
    </nav>

    <header class="hero">
        <div class="container">
            <div class="hero-row">
                <div style="max-width:820px">
                    <h1 class="text-white text-neon">欢迎来到<br><span style="color:var(--primary);font-weight:900">我的第一个</span><span style="color:var(--secondary);margin-left:6px"> 网站</span></h1>
                    <p class="lead">这是我探索网页开发世界的起点，记录我的学习历程与创意实践。</p>
                </div>

                <!-- 右侧卡通科技图（SVG 内联，带浮动与眨眼） -->
                <div class="hero-art" id="heroArt" aria-hidden="true">
                    <svg class="floaty parallax" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
                        <defs>
                            <linearGradient id="g1" x1="0" x2="1">
                                <stop offset="0%" stop-color="#00E5FF"/>
                                <stop offset="100%" stop-color="#7C4DFF"/>
                            </linearGradient>
                        </defs>
                        <rect x="8" y="20" rx="16" ry="16" width="184" height="140" fill="#071428" stroke="url(#g1)" stroke-width="2"/>
                        <!-- 面板内的圆形显示器 -->
                        <g transform="translate(40,50)">
                            <circle cx="40" cy="30" r="28" fill="#0A2333" stroke="#003344" stroke-width="1.5"/>
                            <!-- 眼睛（眨眼会用 JS 切换属性） -->
                            <g id="eyeGroup">
                                <ellipse id="eye" cx="40" cy="30" rx="16" ry="10" fill="#00f0ff" opacity="0.98" />
                                <circle cx="40" cy="30" r="5" fill="#071028"/>
                            </g>
                        </g>
                        <!-- 控制面板与灯光 -->
                        <g transform="translate(22,110)">
                            <rect x="0" y="0" width="156" height="10" rx="2" fill="#06121A"/>
                            <circle cx="18" cy="5" r="3" fill="#00E5FF"/>
                            <circle cx="36" cy="5" r="3" fill="#7C4DFF"/>
                            <circle cx="54" cy="5" r="3" fill="#00FFA3"/>
                        </g>
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <script>
        // 移动菜单切换
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        if(menuBtn && mobileMenu){
            menuBtn.addEventListener('click', ()=> mobileMenu.classList.toggle('hidden'));
        }

        // 右侧卡通图：鼠标视差与眨眼动画
        (function(){
            const art = document.getElementById('heroArt');
            const eye = document.getElementById('eye');
            if(!art) return;

            // 轻量视差：根据鼠标在窗口位置，微量移动 SVG
            window.addEventListener('mousemove', (e)=>{
                const rect = art.getBoundingClientRect();
                // 只在桌面大视窗运行
                if(window.innerWidth < 769) return;
                const cx = rect.left + rect.width/2;
                const cy = rect.top + rect.height/2;
                const dx = (e.clientX - cx) / rect.width; // -0.5..0.5
                const dy = (e.clientY - cy) / rect.height;
                const tx = dx * 12; const ty = dy * 8;
                art.style.transform = `translate3d(${tx}px, ${ty}px, 0)`;
            });

            // 眨眼：周期性改变 eye 的 ry 属性
            if(eye){
                setInterval(()=>{
                    eye.setAttribute('ry', '1');
                    setTimeout(()=> eye.setAttribute('ry','10'), 180);
                }, 4000 + Math.random()*3000);
            }
        })();
    </script>
        <!-- 背景加载诊断脚本已移除 -->
    <!-- 调试浮层与脚本已移除 -->
    <script>
        // Canvas 矩阵背景备份（在 file:// 下始终生效）
        (function(){
            const canvas = document.getElementById('matrixCanvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            let width = 0, height = 0;
            function resize(){
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const letters = '01';
            const fontSize = Math.max(10, Math.floor(Math.min(width, height) / 60));
            const columns = Math.floor(width / fontSize);
            const drops = new Array(columns).fill(0).map(()=> Math.floor(Math.random()*height));

            const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

            function drawStatic(){
                ctx.fillStyle = 'rgba(2,6,10,0.9)';
                ctx.fillRect(0,0,width,height);
                ctx.font = `${fontSize}px monospace`;
                ctx.fillStyle = 'rgba(0,230,200,0.06)';
                for(let i=0;i<200;i++){
                    const x = Math.random()*width;
                    const y = Math.random()*height;
                    ctx.fillText(letters.charAt(Math.random()*letters.length|0), x, y);
                }
            }

            function step(){
                // fade effect
                ctx.fillStyle = 'rgba(0,0,0,0.06)';
                ctx.fillRect(0,0,width,height);
                ctx.fillStyle = '#00ffcc';
                ctx.font = `${fontSize}px monospace`;
                for(let i=0;i<drops.length;i++){
                    const text = letters.charAt(Math.random()*letters.length|0);
                    ctx.fillText(text, i*fontSize, drops[i]*fontSize);
                    if(drops[i]*fontSize > height && Math.random()>0.975) drops[i]=0;
                    drops[i]++;
                }
                requestAnimationFrame(step);
            }

            if(reduced){ drawStatic(); }
            else{ step(); }
        })();
    </script>
